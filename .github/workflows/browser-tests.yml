name: Browser tests

# PR checks also run once inside the main release workflow, before publishing its matching build.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor, gallery and export
            id: editor
            script: e2e
          - name: Usability
            id: usability
            script: e2e:ux
          - name: Cabinet sheets and repeated adds
            id: sheets
            script: e2e:sheets
          - name: Undo, project backups and sharing
            id: feedback
            script: e2e:feedback
          - name: Stacked cabinets and premium kitchens
            id: stacked
            script: e2e:stacked
          - name: Rooms, structures and 3D preview
            id: rooms
            script: e2e:rooms
          - name: Room workspace on desktop and phone
            id: room-workspace
            script: e2e:room-workspace
          - name: Resize, orbit and open in 3D
            id: resize
            script: e2e:resize
          - name: Offline customer preview
            id: customer
            script: e2e:customer
          - name: Installed planner offline
            id: offline
            script: e2e:offline
          - name: Ideas in the measured kitchen
            id: ideas
            script: e2e:ideas
    env:
      # Chrome in the POSIX locale renames downloads with Serbian characters.
      LANG: C.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Chrome version
        run: google-chrome --version
      - name: Run browser checks
        run: npm run ${{ matrix.script }}
      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests-${{ matrix.id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
